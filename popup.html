<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Swapper</title>
  <style>
    body {
      width: 360px;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color: #f3f4f6;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: -0.025em;
      color: white;
    }
    .section {
      margin-bottom: 32px;
    }
    .label {
      color: #9ca3af;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .toggle-container {
      display: flex;
      background: rgba(55, 65, 81, 0.5);
      border-radius: 16px;
      padding: 4px;
      border: 1px solid rgba(75, 85, 99, 0.5);
    }
    .toggle-option {
      flex: 1;
      text-align: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(55, 65, 81, 0.7);
      color: #d1d5db;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .toggle-option:hover {
      transform: scale(1.05);
    }
    .toggle-option.selected {
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }
    .auto-swap {
      background: rgba(55, 65, 81, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(75, 85, 99, 0.5);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .auto-swap-text {
      flex: 1;
    }
    .auto-swap-title {
      font-weight: 600;
      color: white;
      margin-bottom: 4px;
    }
    .auto-swap-desc {
      font-size: 12px;
      color: #9ca3af;
    }
    input[type="checkbox"] {
      display: none;
    }
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 24px;
      background: #4b5563;
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    input[type="checkbox"]:checked + .toggle-switch {
      background: #06b6d4;
    }
    input[type="checkbox"]:checked + .toggle-switch::after {
      transform: translateX(24px);
    }
    .btn-swap {
      width: 100%;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      color: #111827;
      font-weight: 600;
      padding: 14px 0;
      border-radius: 16px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .btn-swap:hover {
      transform: scale(1.02);
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      margin-top: 24px;
    }
    .container {
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="icon">🔄</div>
      <h1>Wiki Swapper</h1>
    </div>

    <!-- Preferred Wiki Toggle -->
    <div class="section">
      <div class="label">Choose your preferred wiki</div>
      <div class="toggle-container" id="toggleContainer">
        <!-- JS will populate this -->
      </div>
    </div>

    <!-- Auto-Swap Toggle -->
    <div class="auto-swap">
      <div class="auto-swap-text">
        <div class="auto-swap-title">Auto-swap on visit</div>
        <div class="auto-swap-desc">Redirect automatically to your preferred wiki</div>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="autoToggle">
        <div class="toggle-switch"></div>
      </label>
    </div>

    <!-- Swap Button -->
    <button id="swapNowBtn" class="btn-swap">
      <span style="font-size: 20px;">🔄</span>
      Swap Current Page
    </button>

    <!-- Footer -->
    <div class="footer">
      Made with ❤️ for truth-seekers
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
